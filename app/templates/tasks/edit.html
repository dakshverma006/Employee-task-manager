{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h4 class="mb-4">Edit Task</h4>
                    <form method="POST" action="/tasks/edit/{{ task.id }}">
                        <div class="mb-3">
                            <label>Title</label>
                            <input type="text" name="title" class="form-control" value="{{ task.title }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Description</label>
                            <textarea name="description" class="form-control" rows="3">{{ task.description }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label>Priority</label>
                            <select name="priority" class="form-select">
                                <option {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
                                <option {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                                <option {% if task.priority == 'High' %}selected{% endif %}>High</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Due Date</label>
                            <input type="date" name="due_date" class="form-control" value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}">
                        </div>
                        <div class="mb-3">
                            <label>Assign To</label>
                            <select name="assigned_to" class="form-select">
                                <option value="">-- Select Employee --</option>
                                {% for emp in employees %}
                                <option value="{{ emp.id }}" {% if task.assigned_to == emp.id %}selected{% endif %}>{{ emp.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">Update Task</button>
                        <a href="/tasks" class="btn btn-secondary w-100 mt-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
