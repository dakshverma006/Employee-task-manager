{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h4 class="mb-4">Edit Employee</h4>
                    <form method="POST" action="/employees/edit/{{ employee.id }}">
                        <div class="mb-3">
                            <label>Name</label>
                            <input type="text" name="name" class="form-control" value="{{ employee.name }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" name="email" class="form-control" value="{{ employee.email }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ employee.phone }}">
                        </div>
                        <div class="mb-3">
                            <label>Address</label>
                            <input type="text" name="address" class="form-control" value="{{ employee.address }}">
                        </div>
                        <div class="mb-3">
                            <label>Designation</label>
                            <input type="text" name="designation" class="form-control" value="{{ employee.designation }}">
                        </div>
                        <button type="submit" class="btn btn-warning w-100">Update Employee</button>
                        <a href="/employees" class="btn btn-secondary w-100 mt-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
